name: AeriaLife

options:
  bundleIdPrefix: com.aeria
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true
  xcodeVersion: "26.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    MARKETING_VERSION: "1.0"
    # Fallback build number for local archives. Xcode Cloud overrides this per
    # build via ci_scripts/ci_pre_xcodebuild.sh (CI_BUILD_NUMBER). Keep it ahead
    # of every number already uploaded to App Store Connect.
    CURRENT_PROJECT_VERSION: "1"
    # Apple Developer Team ID. Copied from the Aeria+ (tvOS) project — same
    # team. If Aeria Life ships under a different Apple Developer account,
    # replace this (developer.apple.com → Membership). Safe to commit either
    # way — it's embedded in every shipped app regardless.
    DEVELOPMENT_TEAM: "4YJN2S39Q4"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Aeria:
    type: application
    platform: iOS
    sources:
      # Widgets/ has its own @main (AeriaWidgetsBundle) and Watch/ has its own
      # @main (AeriaWatchApp) — both must be excluded here or the app target
      # ends up with three @main entry points in one module. ShareExtension/
      # doesn't have its own @main but belongs only to that extension.
      # Shared/ stays included so TodaySnapshot/SharedStorage are visible to
      # the app too.
      - path: Sources
        excludes:
          - "Widgets/**"
          - "Watch/**"
          - "ShareExtension/**"
      - path: Resources
    dependencies:
      - target: AeriaWidgetsExtension
        embed: true
      - target: AeriaWatch
        embed: true
      - target: AeriaShareExtension
        embed: true
    entitlements:
      path: Sources/App/Aeria.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.aeria.life
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: Aeria
        NSSupportsLiveActivities: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
        NSCalendarsFullAccessUsageDescription: "Aeria reads your calendar to build Today and find good times for things — nothing is shared off your device without your say-so."
        NSRemindersFullAccessUsageDescription: "Aeria reads your reminders so Today and Loose Ends stay complete."
        NSLocationWhenInUseUsageDescription: "Aeria uses your location to understand context, like travel time and local weather."
        NSCameraUsageDescription: "Aeria uses the camera to scan receipts, warranties, and other documents into your Vault."
        NSPhotoLibraryUsageDescription: "Aeria can import receipts and documents you've already photographed into your Vault."
        NSFaceIDUsageDescription: "Aeria can lock your Vault and sensitive information behind Face ID."
        NSContactsUsageDescription: "Aeria can link a person in your life to their existing contact card."
        NSSpeechRecognitionUsageDescription: "Aeria can transcribe your voice when you capture something by speaking."
        NSMicrophoneUsageDescription: "Aeria uses the microphone for voice capture into your Life Inbox."
        UIBackgroundModes:
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.aeria.life.refresh
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aeria.life
        PRODUCT_NAME: Aeria
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES

  AeriaWidgetsExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Widgets
      - path: Sources/LiveActivity
      - path: Sources/Shared
      - path: Sources/DesignSystem/Palette.swift
      - path: Sources/DesignSystem/Typography.swift
      - path: Sources/DesignSystem/Metrics.swift
    entitlements:
      path: Sources/Widgets/AeriaWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.aeria.life
    info:
      path: Sources/Widgets/Info.plist
      properties:
        CFBundleDisplayName: Aeria
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aeria.life.widgets
        PRODUCT_NAME: AeriaWidgets
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_EMIT_LOC_STRINGS: YES

  AeriaWatch:
    type: application
    platform: watchOS
    sources:
      - path: Sources/Watch
      - path: Sources/Shared
    info:
      path: Sources/Watch/Info.plist
      properties:
        CFBundleDisplayName: Aeria
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.aeria.life
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aeria.life.watch
        PRODUCT_NAME: AeriaWatch
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_EMIT_LOC_STRINGS: YES

  AeriaShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/ShareExtension
      - path: Sources/Shared
    entitlements:
      path: Sources/ShareExtension/AeriaShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.aeria.life
    info:
      path: Sources/ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Aeria
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 1
              NSExtensionActivationSupportsFileWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aeria.life.share
        PRODUCT_NAME: AeriaShareExtension
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_EMIT_LOC_STRINGS: YES

  AeriaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/AeriaTests
    dependencies:
      - target: Aeria
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.aeria.life.tests

  AeriaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/AeriaUITests
    dependencies:
      - target: Aeria
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.aeria.life.uitests
        TEST_TARGET_NAME: Aeria

schemes:
  Aeria:
    build:
      targets:
        Aeria: all
        AeriaTests: [test]
        AeriaUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - AeriaTests
        - AeriaUITests
    profile:
      config: Release
    archive:
      config: Release
